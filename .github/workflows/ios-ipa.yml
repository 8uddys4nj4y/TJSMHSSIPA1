name: iPhone app (.ipa for sideloading)

# Builds the Matric app (TJS MHSS) for iPhone on a free GitHub Mac and publishes an UNSIGNED .ipa.
# Sideloadly / AltStore signs it with your own Apple ID when you install it. Run it from the Actions tab > "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # lets the run publish the .ipa on the Releases page (GitHub's own per-run token, no secret to set up)

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # only the three Capacitor plugins are needed (the web app is already built into ios/App/App/public)
      - name: Install plugins
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Show Xcode
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | tail -n 60

      - name: Make the .ipa
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP=build/Build/Products/Release-iphoneos/App.app
          test -f "$APP/Info.plist" && test -f "$APP/App" || { echo "The app was not built: no Info.plist / binary in $APP"; ls -R "$APP" | head -20; exit 1; }
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "TJS-MHSS-$VERSION-unsigned.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TJS-MHSS-iPhone-ipa
          path: "*.ipa"
          if-no-files-found: error

      # a public download link on the repository's Releases page (no GitHub login needed to download)
      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="ipa-$VERSION-run${{ github.run_number }}"
          gh release create "$TAG" $(ls *.ipa xcodebuild.log 2>/dev/null) --title "TJS MHSS iPhone $VERSION (run ${{ github.run_number }})" --notes "Unsigned .ipa (if present) and the Xcode build log. Install the .ipa with Sideloadly or AltStore (free Apple ID), see ios/INSTALL-FREE.md."
